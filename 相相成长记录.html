<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>相相成长记录</title>
<style>
:root{--pink:#ff709f;--light:#ffaec9;--rose:#fff0f6;--bg:#fff9fc;--paper:#fff;--ink:#44343f;--muted:#ae96a1;--jade:#36ad9f;--line:#f5dce7;--danger:#ed627e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 3%,#ffe2ee 0,transparent 26rem),radial-gradient(circle at 95% 28%,#ffeaf3 0,transparent 20rem),linear-gradient(150deg,#fffefe,#fff5f9);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}button:active{transform:scale(.96)}.app{max-width:720px;margin:auto;min-height:100dvh;padding:22px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 19px}.brand{font-weight:850;font-size:22px;letter-spacing:-.8px;display:flex;align-items:center;gap:8px}.brand:before{content:'✦';width:31px;height:31px;display:grid;place-items:center;color:#fff;font-size:15px;border-radius:12px;background:linear-gradient(145deg,#ff87b2,#ff5f96);box-shadow:0 7px 13px #e8639761}.brand i{color:var(--pink);font-style:normal}.badge{border-radius:99px;background:#fff0f6;color:#d9578c;padding:6px 10px;font-size:12px;border:1px solid #ffd9e8}.page{display:none}.page.active{display:block;animation:page-in .28s ease}@keyframes page-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.card{background:linear-gradient(145deg,#fff,#fffcfe);border:1px solid #fff;box-shadow:0 10px 28px #bd597d14,0 2px 5px #b4567920;border-radius:22px;padding:16px;margin:12px 0}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff76a6,#ffa7c6);box-shadow:0 15px 34px #df679252}.hero:after,.hero:before{content:'';position:absolute;border:1px solid #ffffff4f;border-radius:50%}.hero:before{width:145px;height:145px;right:-52px;top:-65px}.hero:after{width:76px;height:76px;right:48px;bottom:-43px}.hero h1{position:relative;z-index:1;font-size:23px;letter-spacing:-.5px;margin:0 0 7px}.hero p{position:relative;z-index:1;margin:0;opacity:.92}.balances{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.balance{background:#ffffff2b;border:1px solid #ffffff42;border-radius:16px;padding:12px;backdrop-filter:blur(4px)}.balance b{font-size:27px;letter-spacing:-1px;display:block;margin-top:2px}.jade{color:var(--jade)}.hero .jade{color:#ddfff8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{position:relative;overflow:hidden;padding:15px;border-radius:18px;background:linear-gradient(145deg,#fff5f9,#ffeff5)}.stat:nth-child(2n){background:linear-gradient(145deg,#f8fffd,#edfffa)}.stat:nth-child(2n) b{color:var(--jade)}.stat b{font-size:25px;letter-spacing:-.8px;display:block;margin-top:3px}.muted{color:var(--muted);font-size:13px}.section-title{font-weight:800;margin:25px 3px 9px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.2px}.progress{height:10px;background:#f6e5ed;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px #9e486d10}.progress span{height:100%;display:block;background:linear-gradient(90deg,#ff639b,#ffb0cb);border-radius:99px;box-shadow:0 1px 5px #f25c9075}.jadebar span{background:linear-gradient(90deg,#2eaa9d,#76d9c9)}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#fffcfefa;backdrop-filter:blur(16px);border-top:1px solid #f8e5ee;box-shadow:0 -9px 28px #9b46620d}.navin{width:min(720px,100%);display:flex;justify-content:space-around}.nav button{min-width:57px;background:transparent;color:var(--muted);padding:6px 12px;font-size:12px}.nav button.active{color:var(--pink);font-weight:800}.nav .icon{width:31px;height:26px;margin:auto;display:grid;place-items:center;font-size:19px;line-height:21px;border-radius:11px}.nav button.active .icon{background:#ffe4ef;box-shadow:inset 0 0 0 1px #ffd5e5}.primary{background:linear-gradient(135deg,#ff6199,#ff9dbe);color:#fff;border-radius:14px;padding:11px 15px;font-weight:750;box-shadow:0 7px 14px #e85d9140}.primary:hover{filter:brightness(1.03);box-shadow:0 9px 18px #e85d9153}.secondary{background:#fff0f6;color:#d9578c;border-radius:12px;padding:9px 12px}.outline{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 12px}.danger{color:var(--danger);background:#fff0f3}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:15px 12px;text-align:left;border:1px solid #fae0eb;border-radius:17px;background:linear-gradient(145deg,#fff,#fff8fb);box-shadow:0 4px 10px #a94f7110}.quick button:hover{transform:translateY(-2px);border-color:#ffc4db}.quick b{display:block;margin-bottom:3px}.quick small{color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:0;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus,select:focus{border-color:#ff9dc0;box-shadow:0 0 0 3px #ffb5d129}textarea{resize:vertical;min-height:60px}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.record,.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #faeef3}.record:last-child,.item:last-child{border-bottom:0}.dot{width:10px;height:10px;background:var(--pink);border-radius:50%;flex:none;box-shadow:0 0 0 4px #ffe8f1}.dot.j{background:var(--jade);box-shadow:0 0 0 4px #e5fbf7}.record .name,.item .name{flex:1;font-weight:700}.record .amount{font-weight:800;color:#d9578c}.record .amount.j{color:var(--jade)}.tiny{font-size:12px;padding:6px 8px;border-radius:8px}.tabs{display:flex;gap:8px;margin-bottom:11px;padding:4px;background:#fff1f6;border-radius:13px}.tabs button{flex:1;padding:9px;background:transparent;border-radius:9px;color:#a76e87}.tabs button.active{background:#fff;color:var(--pink);box-shadow:0 2px 8px #b25e7a19}.wish{color:#f0a326;font-size:18px}.inline{border:0!important;padding:3px!important;font-weight:700;background:transparent!important}.price{width:64px!important;text-align:right}.empty{text-align:center;color:var(--muted);padding:25px 8px}.milestones{display:flex;gap:8px;flex-wrap:wrap}.mile{width:43px;height:43px;border-radius:15px;background:#faf0f4;color:#c5a9b5;display:grid;place-items:center;font-size:11px;font-weight:800}.mile.done{background:linear-gradient(145deg,#ffb0cb,#ff86af);color:#fff;box-shadow:0 5px 10px #e9769c43}.notice{padding:11px 12px;border-radius:13px;background:#fff6d9;color:#94711b;font-size:13px;border:1px solid #fae9aa}.modal{position:fixed;inset:0;background:#4a3b4560;z-index:10;display:none;align-items:end;justify-content:center;backdrop-filter:blur(3px)}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(145deg,#fff,#fff9fc);border-radius:27px 27px 0 0;padding:21px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px #55314124}.sheet:before{content:'';width:36px;height:4px;background:#efd8e3;border-radius:99px;display:block;margin:0 auto 15px}.sheet h2{margin:0 0 6px}.report{width:100%;border-radius:18px;border:1px solid var(--line);display:block;box-shadow:0 8px 18px #b1607d14}.actions{display:flex;gap:8px;flex-wrap:wrap}.settings details{border-top:1px solid var(--line);padding:13px 0}.settings summary{font-weight:750;cursor:pointer}.check{width:auto;accent-color:var(--pink)}.calendar{user-select:none}.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 11px}.cal-head b{letter-spacing:.2px}.cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.cal-week{color:var(--muted);font-size:11px;margin-bottom:3px}.cal-days{gap:3px}.cal-day{height:42px;background:transparent;color:var(--ink);padding:2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.cal-day:hover{background:#fff0f6}.cal-day.today span{width:23px;height:23px;display:grid;place-items:center;border-radius:9px;background:#fce1ec;color:#d9578c;font-weight:800}.cal-day.breakfast{background:#fff0f6}.cal-day.breakfast i{color:var(--pink)}.cal-day.extra:not(.breakfast) i{color:var(--jade)}.cal-day i{font-style:normal;height:10px;line-height:8px;font-size:11px}.cal-key{display:flex;gap:13px;flex-wrap:wrap;border-top:1px solid #faeaf1;margin-top:10px;padding-top:10px;color:var(--muted);font-size:11px}.cal-key i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}.k-breakfast{background:var(--pink)}.k-extra{background:var(--jade)}.k-award{background:#f0a326}@media(min-width:620px){.app{padding-left:24px;padding-right:24px}.quick{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app"><div class="top"><div class="brand">相相<i>成长记录</i></div><span class="badge" id="today"></span></div>
<section id="dashboard" class="page active"></section><section id="score" class="page"></section><section id="report" class="page"></section><section id="shop" class="page"></section></main>
<nav class="nav"><div class="navin"><button class="active" data-page="dashboard"><span class="icon">♡</span>看板</button><button data-page="score"><span class="icon">＋</span>记分</button><button data-page="report"><span class="icon">▣</span>战报</button><button data-page="shop"><span class="icon">☆</span>商店</button></div></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='xiangxiang-growth-v1', D=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const defaults={version:1,activities:[{id:'breakfast',name:'早餐打卡',coin:10,limit:1,core:true},{id:'share',name:'分享照片/视频',coin:2,limit:3},{id:'task',name:'随机任务',coin:10,limit:0},{id:'talk',name:'沟通成就',coin:20,limit:0}],records:[],redeems:[],items:[['一杯奶茶',30,'coin'],['甜品下午茶',40,'coin'],['一顿外卖',60,'coin'],['小饰品',100,'coin'],['两张电影票',120,'coin'],['大牌口红',3,'jade'],['进阶化妆品',5,'jade'],['一双鞋',8,'jade'],['一条裙子',10,'jade'],['周边游',25,'jade']].map(([name,price,cur],order)=>({id:uid(),name,price,cur,wish:false,order})),revive:{count:0,pending:0},streak:{cur:0,max:0,lastDate:'',restored:false},awards:[]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{S=structuredClone(defaults)};let calOffset=0;
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()};function esc(s=''){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))};
function dateDiff(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)}
function balance(){return {coin:S.records.reduce((n,r)=>n+Number(r.coin||0),0)-S.redeems.filter(r=>r.cur==='coin').reduce((n,r)=>n+Number(r.price),0),jade:S.records.reduce((n,r)=>n+Number(r.jade||0),0)-S.redeems.filter(r=>r.cur==='jade').reduce((n,r)=>n+Number(r.price),0)}}
function breakfastStats(){let ds=[...new Set(S.records.filter(r=>r.activity==='breakfast').map(r=>r.date))].sort(),run=0,max=0,last='',lastRun=0,prev='';ds.forEach(d=>{run=prev&&dateDiff(prev,d)===1?run+1:1;max=Math.max(max,run);prev=d;last=d;lastRun=run});let gap=last?dateDiff(last,D()):0;return {days:ds,last,lastRun,max,cur:gap===0||gap===1?lastRun:0,pending:gap>1?lastRun:0}}
function refreshBreak(){let x=breakfastStats();S.streak={...S.streak,cur:x.cur,max:x.max,lastDate:x.last,restored:false};S.revive={...S.revive,pending:x.pending}}
function rebuildStreakAndAwards(){S.revive=S.revive||{count:0,pending:0};S.records=S.records.filter(r=>r.activity!=='milestone');let ds=[...new Set(S.records.filter(r=>r.activity==='breakfast').map(r=>r.date))].sort(),generated=[],run=0,prev='',highest=0,seen=new Set;for(const d of ds){run=prev&&dateDiff(prev,d)===1?run+1:1;let rewards=[];if(run%7===0)rewards.push(['weekly-'+d,1,'连续满 '+run+' 天']);if(run%30===0)rewards.push(['monthly-'+d,2,'连续满 '+run+' 天']);if(run>highest){[[7,3],[14,5],[21,8],[30,12],[45,18],[60,25],[100,45]].forEach(([n,j])=>{if(run===n&&!seen.has(n)){seen.add(n);rewards.push(['record-'+n,j,'突破历史纪录 '+n+' 天'])}})}highest=Math.max(highest,run);rewards.forEach(([key,jade,label])=>generated.push({id:uid(),date:d,activity:'milestone',milestoneKey:key,label:'里程碑奖励：'+label,coin:0,jade,note:'系统自动结算（随早餐记录回溯核算）',createdAt:new Date(d+'T12:00').getTime()}));prev=d}S.records.push(...generated);S.awards=generated.map(r=>r.milestoneKey);refreshBreak()}
function addRecord(activity,coin,jade,note,date){S.records.push({id:uid(),date,activity,label:(S.activities.find(a=>a.id===activity)||{}).name||'自定义奖励',coin:+coin||0,jade:+jade||0,note,createdAt:Date.now()});rebuildStreakAndAwards();save()}
function status(){refreshBreak();let t=D(),has=S.records.some(r=>r.activity==='breakfast'&&r.date===t);return has?'已完成今日早餐':S.streak.cur?'今天还没打卡':'早餐连胜已中断'}
function open(html){sheet.innerHTML=html;modal.classList.add('open')}function close(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)close()};
function render(){document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});renderDash();renderScore();renderShop();renderReport()}
function records(list,empty='暂无记录',actions=false){return list.length?list.map(r=>`<div class="record"><i class="dot ${r.jade?'j':''}"></i><div class="name">${esc(r.label)}<div class="muted">${r.date}${r.note?' · '+esc(r.note):''}</div></div><span class="amount ${r.jade?'j':''}">${r.coin?`${r.coin>0?'+':''}${r.coin} 币`:''}${r.jade?`${r.jade>0?'+':''}${r.jade} 玉`:''}</span>${actions&&r.id&&r.activity!=='milestone'?`<button class="secondary tiny" onclick="editRecord('${r.id}')">编辑</button><button class="danger tiny" onclick="delRecord('${r.id}')">删除</button>`:''}</div>`).join(''):`<div class="empty">${empty}</div>`}
function calendarHtml(){let now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+calOffset,1),year=m.getFullYear(),month=m.getMonth(),first=m.getDay(),days=new Date(year,month+1,0).getDate(),today=D(),out='<div class="calendar"><div class="cal-head"><button class="secondary tiny" onclick="moveCalendar(-1)">‹</button><b>'+year+' 年 '+(month+1)+' 月</b><button class="secondary tiny" onclick="moveCalendar(1)">›</button></div><div class="cal-week">'+['日','一','二','三','四','五','六'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="cal-days">';for(let i=0;i<first;i++)out+='<span></span>';for(let day=1;day<=days;day++){let ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),rs=S.records.filter(r=>r.date===ds),hasBreakfast=rs.some(r=>r.activity==='breakfast'),hasExtra=rs.some(r=>r.activity!=='breakfast'&&r.activity!=='milestone'),hasAward=rs.some(r=>r.activity==='milestone');out+='<button class="cal-day '+(ds===today?'today':'')+' '+(hasBreakfast?'breakfast':'')+' '+(hasExtra?'extra':'')+'" onclick="openCalendarDate(\''+ds+'\')"><span>'+day+'</span><i>'+(hasBreakfast?'●':hasExtra?'•':hasAward?'✦':'')+'</i></button>'}return out+'</div><div class="cal-key"><span><i class="k-breakfast"></i>早餐</span><span><i class="k-extra"></i>加分记录</span><span><i class="k-award"></i>里程碑</span></div></div>'}
function moveCalendar(n){calOffset+=n;renderDash()}function openCalendarDate(date){go('score');setTimeout(()=>{historyDate.value=date;renderHistory();historyDate.scrollIntoView({behavior:'smooth',block:'center'})},30)}
function renderDash(){
 let b=balance(),next=7-S.streak.cur%7||7;
 let breakfastDays=new Set(S.records.filter(r=>r.activity==='breakfast').map(r=>r.date)).size;
 let recent=[...S.records,...S.redeems.map(r=>({...r,label:'兑换：'+r.itemName,coin:r.cur==='coin'?-r.price:0,jade:r.cur==='jade'?-r.price:0}))].sort((x,y)=>y.createdAt-x.createdAt).slice(0,9);
 let miles=[7,14,21,30,45,60,100].map(x=>'<span class="mile '+(S.awards.includes('record-'+x)?'done':'')+'">'+x+'天</span>').join('');
 let wishes=S.items.filter(i=>i.wish).slice(0,3).map(i=>{let value=b[i.cur],p=Math.min(100,value/i.price*100),unit=i.cur==='coin'?'币':'玉';return '<div class="card"><div class="row"><b class="grow">☆ '+esc(i.name)+'</b><span class="'+(i.cur==='jade'?'jade':'')+'">'+value+'/'+i.price+' '+unit+'</span></div><div class="progress '+(i.cur==='jade'?'jadebar':'')+'" style="margin-top:9px"><span style="width:'+p+'%"></span></div></div>'}).join('');
 dashboard.innerHTML='<div class="card hero"><h1>'+status()+'</h1><p>'+(S.streak.cur?'再坚持 '+next+' 天，下一次连胜结算 +1 玉':'今天也值得为自己加分 ♡')+'</p><div class="balances"><div class="balance">相相币<b>'+b.coin+'</b></div><div class="balance">相相玉<b class="jade">'+b.jade+'</b></div></div></div><div class="grid"><div class="stat"><span class="muted">当前连胜</span><b>'+S.streak.cur+' 天</b></div><div class="stat"><span class="muted">历史最长</span><b>'+S.streak.max+' 天</b></div><div class="stat"><span class="muted">累计早餐</span><b>'+breakfastDays+' 天</b></div><div class="stat"><span class="muted">已使用复活卡</span><b>'+S.revive.count+' 次</b></div></div><div class="section-title"><span>连胜进度</span><span class="muted">距下一结算 '+next+' 天</span></div><div class="progress"><span style="width:'+(S.streak.cur%7)/7*100+'%"></span></div>'+(S.revive.pending?'<div class="notice" style="margin-top:12px">连胜中断前为 '+S.revive.pending+' 天。复活卡第 '+(S.revive.count+1)+' 次需 '+(50*2**S.revive.count)+' 币。 <button class="secondary tiny" onclick="revive()">使用复活卡</button></div>':'')+'<div class="section-title"><span>打卡日历</span><span class="muted">点日期查看账本</span></div><div class="card">'+calendarHtml()+'</div><div class="section-title"><span>里程碑</span><span class="muted">破纪录奖励</span></div><div class="milestones">'+miles+'</div>'+(wishes?'<div class="section-title"><span>心愿目标</span></div>'+wishes:'')+'<div class="section-title"><span>最近流水</span><button class="secondary tiny" onclick="go(\'score\')">去记分</button></div><div class="card">'+records(recent)+'</div>';
}
function renderScore(){let todayRecords=S.records.filter(r=>r.date===D()),acts=S.activities;score.innerHTML=`<div class="card"><h2 style="margin-top:0">记一笔</h2><p class="muted">早餐是唯一影响连续打卡的项目；其余都是自由加分。</p><div class="quick">${acts.map(a=>`<button onclick="recordForm('${a.id}')"><b>${esc(a.name)}</b><small>默认 +${a.coin} 币${a.limit?' · 每日 '+a.limit+' 次':''}${a.core?' · 连胜核心':''}</small></button>`).join('')}<button onclick="recordForm('custom')"><b>＋ 自定义奖励</b><small>临时名目或特别奖励</small></button></div></div><div class="section-title"><span>今天的记录</span></div><div class="card">${records(todayRecords,'今天还没有记分',true)}</div><div class="section-title"><span>历史账本</span><span class="muted">可修改任意日期</span></div><div class="card"><label style="margin-top:0">查看日期</label><input id="historyDate" type="date" value="${D()}" onchange="renderHistory()"><div id="historyRecords"></div></div><div class="card settings"><details><summary>管理加分项目库</summary><p class="muted">限次填 0 表示不限制；早餐为唯一连胜核心。</p><div id="activityList">${acts.map(a=>`<div class="row"><input class="grow" value="${esc(a.name)}" onchange="editActivity('${a.id}','name',this.value)"><input style="width:62px" type="number" value="${a.coin}" onchange="editActivity('${a.id}','coin',this.value)"><span class="muted">币</span><input style="width:54px" type="number" min="0" value="${a.limit}" onchange="editActivity('${a.id}','limit',this.value)"><span class="muted">/日</span>${a.core?'<span class="badge">核心</span>':`<button class="secondary tiny" onclick="removeActivity('${a.id}')">删除</button>`}</div>`).join('')}</div><button class="outline" style="margin-top:10px" onclick="newActivity()">＋ 新增加分项目</button></details><details><summary>数据备份与恢复</summary><div class="actions" style="margin-top:10px"><button class="secondary" onclick="exportData()">导出 JSON</button><label class="secondary" style="margin:0;cursor:pointer">导入 JSON<input type="file" accept="application/json" onchange="importData(this)" hidden></label><button class="danger tiny" onclick="if(confirm('将清空全部本地数据，确定吗？')){localStorage.removeItem(KEY);location.reload()}">清空数据</button></div></details></div>`;setTimeout(renderHistory,0)}
function renderHistory(){let host=document.getElementById('historyRecords'),date=document.getElementById('historyDate')?.value;if(host&&date)host.innerHTML=records(S.records.filter(r=>r.date===date),'这一天还没有记录',true)}
function renderShop(){let b=balance();shop.innerHTML=`<div class="card"><h2 style="margin-top:0">相相商店</h2><p class="muted">只兑换物质奖励。点击名称或价格可直接编辑。</p><div class="tabs"><button id="coinTab" class="active" onclick="shopList('coin')">相相币 · ${b.coin}</button><button id="jadeTab" onclick="shopList('jade')">相相玉 · ${b.jade}</button></div><div id="shopList"></div></div>`;shopList(window.currentShop||'coin')}
function shopList(cur){window.currentShop=cur;let b=balance()[cur];coinTab.classList.toggle('active',cur==='coin');jadeTab.classList.toggle('active',cur==='jade');shopListEl=document.getElementById('shopList');shopListEl.innerHTML=S.items.filter(i=>i.cur===cur).map(i=>`<div class="item"><button class="wish" onclick="wish('${i.id}')">${i.wish?'★':'☆'}</button><input class="name inline" value="${esc(i.name)}" onchange="editItem('${i.id}','name',this.value)"><input class="price inline" type="number" min="0" value="${i.price}" onchange="editItem('${i.id}','price',this.value)"><span>${cur==='coin'?'币':'玉'}</span><button class="primary tiny" onclick="redeem('${i.id}')">兑换</button><button class="danger tiny" onclick="deleteItem('${i.id}')">×</button></div>`).join('')+`<button class="outline" style="margin-top:12px" onclick="addItem('${cur}')">＋ 新增商品</button>`}
function renderReport(){report.innerHTML=`<div class="card"><h2 style="margin-top:0">每日战报</h2><label>选择日期</label><input id="reportDate" type="date" value="${D()}" onchange="drawReport()"><canvas id="canvas" width="640" height="860" class="report" style="margin-top:14px"></canvas><div class="actions" style="margin-top:12px"><button class="primary" onclick="downloadReport()">下载 PNG</button><button class="secondary" onclick="drawReport()">刷新战报</button></div></div>`;setTimeout(drawReport,0)}
function drawReport(){let c=document.getElementById('canvas');if(!c)return;let d=document.getElementById('reportDate').value,ctx=c.getContext('2d'), b=balance(), rs=S.records.filter(r=>r.date===d);ctx.fillStyle='#fff9fc';ctx.fillRect(0,0,640,860);ctx.fillStyle='#ff7eb3';ctx.fillRect(0,0,640,160);ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('相相成长记录',48,72);ctx.font='23px sans-serif';ctx.fillText(d+' · 今日战报',48,112);ctx.fillStyle='#4a3b45';ctx.font='bold 28px sans-serif';ctx.fillText('今天的每一份努力，都在发光 ♡',48,220);ctx.fillStyle='#fff';ctx.strokeStyle='#f5dce7';ctx.lineWidth=2;ctx.roundRect(40,260,560,140,22);ctx.stroke();ctx.fillStyle='#d9578c';ctx.font='bold 32px sans-serif';ctx.fillText('+'+rs.reduce((n,r)=>n+(+r.coin||0),0)+' 相相币',70,322);ctx.fillStyle='#3fbfb0';ctx.fillText('+'+rs.reduce((n,r)=>n+(+r.jade||0),0)+' 相相玉',350,322);ctx.fillStyle='#4a3b45';ctx.font='20px sans-serif';ctx.fillText('当前连胜 '+S.streak.cur+' 天  ·  余额 '+b.coin+' 币 / '+b.jade+' 玉',70,370);ctx.font='bold 24px sans-serif';ctx.fillText('得分明细',48,465);ctx.font='20px sans-serif';let y=510;rs.slice(0,9).forEach(r=>{ctx.fillStyle='#4a3b45';ctx.fillText(r.label+(r.note?' · '+r.note:''),65,y);ctx.fillStyle=r.jade?'#3fbfb0':'#d9578c';ctx.fillText(r.coin?`+${r.coin} 币`:`+${r.jade} 玉`,480,y);y+=42});if(!rs.length){ctx.fillStyle='#b8a3ae';ctx.fillText('这一天还没有记录',65,y)}ctx.fillStyle='#ff7eb3';ctx.font='20px sans-serif';ctx.fillText('一起慢慢变好',225,805)}
function recordForm(id){let a=S.activities.find(x=>x.id===id), core=a?.core;open(`<h2>${a?esc(a.name):'自定义奖励'}</h2><p class="muted">${core?'这笔早餐将参与连胜计算。':'记录一次值得鼓励的小事。'}</p><label>日期</label><input id="fdate" type="date" value="${D()}"><label>获得相相币</label><input id="fcoin" type="number" value="${a?.coin||0}"><label>额外相相玉</label><input id="fjade" type="number" value="0"><label>备注</label><textarea id="fnote" placeholder="例如：分享了可爱的照片"></textarea><div class="actions" style="margin-top:16px"><button class="primary" onclick="submitRecord('${id}')">记入账本</button><button class="outline" onclick="close()">取消</button></div>`)}
function submitRecord(id){let date=fdate.value, a=S.activities.find(x=>x.id===id);if(!date)return alert('请选择日期');if(a?.limit&&S.records.filter(r=>r.date===date&&r.activity===id).length>=a.limit)return alert(a.name+' 已达到当日 '+a.limit+' 次上限');addRecord(id,+fcoin.value,+fjade.value,fnote.value,date);close()}
function editRecord(id){let r=S.records.find(x=>x.id===id);if(!r)return;open(`<h2>编辑记录</h2><p class="muted">修改后，余额会立即重新计算。</p><label>项目名称</label><input id="fLabel" value="${esc(r.label)}"><label>日期</label><input id="fdate" type="date" value="${r.date}"><label>相相币</label><input id="fcoin" type="number" value="${r.coin||0}"><label>相相玉</label><input id="fjade" type="number" value="${r.jade||0}"><label>备注</label><textarea id="fnote">${esc(r.note||'')}</textarea><div class="actions" style="margin-top:16px"><button class="primary" onclick="saveRecord('${id}')">保存修改</button><button class="outline" onclick="close()">取消</button></div>`)}
function saveRecord(id){let r=S.records.find(x=>x.id===id);if(!r)return;r.label=fLabel.value.trim()||r.label;r.date=fdate.value;r.coin=+fcoin.value||0;r.jade=+fjade.value||0;r.note=fnote.value;rebuildStreakAndAwards();save();close()}
function delRecord(id){if(confirm('删除这条记录？余额、连胜与相关里程碑会自动回溯核算。')){S.records=S.records.filter(r=>r.id!==id);rebuildStreakAndAwards();save()}}
function revive(){let cost=50*2**S.revive.count;if(balance().coin<cost)return alert('相相币不足，还差 '+(cost-balance().coin)+' 币');if(!confirm('花费 '+cost+' 币恢复 '+S.revive.pending+' 天连胜？'))return;S.redeems.push({id:uid(),date:D(),itemName:'连胜复活卡',cur:'coin',price:cost,createdAt:Date.now()});S.revive.count++;S.streak.cur=S.revive.pending;S.streak.restored=true;S.revive.pending=0;save()}
function editActivity(id,k,v){let a=S.activities.find(x=>x.id===id);a[k]=(k==='coin'||k==='limit')?Math.max(0,+v):v;save()}function newActivity(){let n=prompt('项目名称');if(!n)return;let p=+prompt('默认相相币分值','10');S.activities.push({id:uid(),name:n,coin:p||0,limit:0});save()}function removeActivity(id){if(confirm('删除这个项目？历史记录不受影响。')){S.activities=S.activities.filter(a=>a.id!==id);save()}}
function editItem(id,k,v){let i=S.items.find(x=>x.id===id);i[k]=k==='price'?Math.max(0,+v):v;save()}function wish(id){S.items.find(i=>i.id===id).wish=!S.items.find(i=>i.id===id).wish;save()}function addItem(cur){let n=prompt('商品名称');if(!n)return;let p=+prompt('价格',cur==='coin'?'50':'3');S.items.push({id:uid(),name:n,price:p||0,cur,wish:false,order:S.items.length});save()}function deleteItem(id){if(confirm('删除商品？')){S.items=S.items.filter(i=>i.id!==id);save()}}
function redeem(id){let i=S.items.find(x=>x.id===id), b=balance()[i.cur];if(b<i.price)return alert('还差 '+(i.price-b)+' '+(i.cur==='coin'?'相相币':'相相玉'));if(confirm('兑换「'+i.name+'」？')){S.redeems.push({id:uid(),date:D(),itemName:i.name,cur:i.cur,price:i.price,createdAt:Date.now()});save()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='相相成长记录-'+D()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.records||!x.items)throw 0;if(confirm('导入会完整替换当前数据，继续吗？')){S=x;S.revive=S.revive||{count:0,pending:0};rebuildStreakAndAwards();save();alert('导入成功')}}catch{alert('不是有效的备份文件')}};r.readAsText(f)}function downloadReport(){let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='相相战报-'+reportDate.value+'.png';a.click()}function go(p){document.querySelector(`[data-page="${p}"]`).click()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');b.classList.add('active');if(b.dataset.page==='report')renderReport()});rebuildStreakAndAwards();localStorage.setItem(KEY,JSON.stringify(S));render();
</script></body></html>
